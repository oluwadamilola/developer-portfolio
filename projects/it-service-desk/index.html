<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A demonstration IT service desk dashboard for managing support tickets."
    />
    <meta name="theme-color" content="#1C1917" />
    <title>Service Desk Dashboard</title>
    <script>
      (() => {
        let theme;

        try {
          theme = localStorage.getItem("service-desk-theme");
        } catch (error) {
          console.warn("Could not read the saved theme preference.", error);
        }

        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#1C1917" : "#FAFAF9");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
